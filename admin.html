<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje lokalizacje</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

<h1>Moja lokalizacja</h1>

<p id="status">Pobieranie ostatniej lokalizacji...</p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL = "https://zkabtpwxrkpecbzzsksh.supabase.co";

const SUPABASE_KEY = "TWÓJ_KLUCZ_SUPABASE";

async function loadLocation() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/locations?select=latitude,longitude,created_at&order=created_at.desc&limit=1",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const data = await response.json();

        if (!data.length) {
            document.getElementById("status").innerText =
                "Brak zapisanych lokalizacji.";
            return;
        }

        const location = data[0];

        const latitude = location.latitude;
        const longitude = location.longitude;

        document.getElementById("status").innerText =
            "Ostatnia lokalizacja: " + location.created_at;

        const map = L.map("map").setView(
            [latitude, longitude],
            15
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup("Ostatnia lokalizacja")
            .openPopup();

    } catch (error) {

        document.getElementById("status").innerText =
            "BŁĄD: " + error.message;

        console.error(error);
    }
}

loadLocation();

</script>

</body>
</html>
