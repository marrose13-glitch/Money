                <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udostępnij lokalizację</title>
</head>

<body>

<h1>Udostępnij lokalizację</h1>

<p>Kliknij przycisk i dobrowolnie zezwól na udostępnienie lokalizacji.</p>

<button onclick="shareLocation()">
    Udostępnij lokalizację
</button>

<p id="status"></p>

<script>

const SUPABASE_URL = "https://zkabtpwxrkpecbzzsksh.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprYWJ0cHd4cmtwZWNienpza3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzUxNzgsImV4cCI6MjEwNTU1MTE3OH0.30EeR7a5XoyfxmpLvU4jPkqBKXzLEoK4OM9XZpp-7jk";

async function shareLocation() {

    const status = document.getElementById("status");

    if (!navigator.geolocation) {
        status.innerText = "Ta przeglądarka nie obsługuje lokalizacji.";
        return;
    }

    status.innerText = "Pobieranie lokalizacji...";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            status.innerText = "Zapisywanie lokalizacji...";

            try {

                const response = await fetch(
                    SUPABASE_URL + "/rest/v1/locations",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY,
                            "Prefer": "return=minimal"
                        },

                        body: JSON.stringify({
                            latitude: latitude,
                            longitude: longitude,
                            device_id: "device"
                        })
                    }
                );

                if (!response.ok) {

                    const errorText = await response.text();

                    status.innerText =
                        "BŁĄD SUPABASE: " + errorText;

                    console.log(errorText);

                    return;
                }

                status.innerText =
                    "✅ Lokalizacja została zapisana.";

            } catch (error) {

                console.error(error);

                status.innerText =
                    "BŁĄD POŁĄCZENIA: " + error.message;
            }
        },

        function(error) {

            status.innerText =
                "Błąd lokalizacji: " + error.message;

        }
    );
}

</script>

</body>
</html>
